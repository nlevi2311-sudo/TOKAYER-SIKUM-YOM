# פריסה אוטומטית של מערכת הבקרה (bakara) ב-Render: אתר + בסיס נתונים PostgreSQL.
# ב-Render: New > Blueprint > בוחרים את המאגר ואת הענף > Apply.
databases:
  - name: bakara-db
    plan: free
    region: frankfurt
    databaseName: bakara
    user: bakara

services:
  - type: web
    name: bakara
    runtime: node
    plan: free
    region: frankfurt
    rootDir: bakara
    buildCommand: npm ci --include=dev && npx prisma db push && npm run seed:if-empty && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: bakara-db
          property: connectionString
