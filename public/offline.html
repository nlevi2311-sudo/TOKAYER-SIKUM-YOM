<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#127187" />
    <title>אין חיבור | טוקאייר</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Heebo, system-ui, sans-serif; background: #f4f8f8; color: #16333b; }
      main { max-width: 22rem; padding: 2rem; text-align: center; background: #fff; border: 1px solid #dde9ea; border-radius: 1.5rem; }

      h1 { color: #127187; font-size: 1.4rem; margin: 1rem 0 .5rem; }
      p { color: #636366; line-height: 1.6; }
      button { margin-top: 1rem; background: #127187; color: #fff; border: 0; border-radius: .75rem; padding: .75rem 1.5rem; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-mark.png" alt="טוקאייר" />
      <h1>אין חיבור לאינטרנט</h1>

      <button onclick="location.reload()">לנסות שוב</button>
    </main>
  </body>
</html>
